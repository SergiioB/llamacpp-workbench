[project]
name = "llama-webui"
version = "0.1.0"
description = "Minimal local web UI for managing llama.cpp, chats, and inference settings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]

[project.scripts]
llama-webui = "llama_webui.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llama_webui"]
