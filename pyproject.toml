[project]
name = "llama-webui"
version = "0.1.0"
description = "Standalone local llama.cpp workbench with persistent chats, model management, streaming responses, RPC split serving, and hardware-aware runtime tuning."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Sergio Barrientos", email = "sergio@sergiiob.dev"},
]
keywords = ["llama.cpp", "gguf", "local-llm", "edge-ai", "llm-inference", "rk3588", "radxa", "benchmarking", "webui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[project.scripts]
llama-webui = "llama_webui.main:run"
hf-discover = "llama_webui.hf_discovery:cli_main"

[project.urls]
Homepage = "https://github.com/SergiioB/llamacpp-workbench"
Repository = "https://github.com/SergiioB/llamacpp-workbench"
Issues = "https://github.com/SergiioB/llamacpp-workbench/issues"
Documentation = "https://github.com/SergiioB/llamacpp-workbench#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llama_webui"]

# =============================================================================
# Ruff Configuration (Linter + Formatter)
# =============================================================================
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # Pyflakes
  "I",      # isort
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "UP",     # pyupgrade
  "ARG",    # flake8-unused-arguments
  "SIM",    # flake8-simplify
  "FIX",    # flake8-fixme (TODO/FIXME/HACK/XXX detection)
]
ignore = [
  "E501",   # line too long (handled by formatter)
  "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["llama_webui"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["ARG"]
"tests/*" = ["ARG"]

# =============================================================================
# Mypy Configuration (Type Checker)
# =============================================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
implicit_reexport = false
strict_equality = true

[[tool.mypy.overrides]]
module = "llama_webui.main"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "uvicorn"
ignore_missing_imports = true
