name: Feature Request
description: Suggest a new feature
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## Feature Description
        Describe the feature you'd like to see.

        ## Use Case
        What's the problem this solves? Who would use it?

        ## Proposed Solution
        How do you think this could be implemented?

        ## Alternatives Considered
        Any alternatives you've considered?

        ## Additional Context
        Screenshots, examples, or references.
