name: Bug Report
description: File a bug report
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Description
        Describe the bug clearly.

        ## Steps to Reproduce
        1. Go to '...'
        2. Run '...'
        3. See error

        ## Expected Behavior
        What should happen.

        ## Environment
        - OS: [e.g. Ubuntu 22.04, RK3588, etc.]
        - Python version:
        - Hardware: [e.g. NVIDIA RTX 3080, RK3588, etc.]
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Paste any relevant error messages or logs
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context about the problem
    validations:
      required: false
